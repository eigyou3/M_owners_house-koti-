<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 背景 -->
  <rect width="32" height="32" rx="6" fill="#2d2c2a"/>
  <!-- 大屋根（切妻） -->
  <polygon points="16,3 30,13 2,13" fill="#f5f3ef"/>
  <!-- 外壁（本体） -->
  <rect x="3" y="13" width="26" height="16" fill="#f5f3ef"/>
  <!-- 内側の小屋根（木部分の山） -->
  <polygon points="16,10 24,17 8,17" fill="#2d2c2a"/>
  <!-- 木部分（横張り） -->
  <rect x="9" y="17" width="14" height="8" fill="#b5845a"/>
  <!-- ドア -->
  <rect x="14" y="21" width="4" height="8" fill="#2d2c2a"/>
  <!-- 右上の四角窓 -->
  <rect x="22" y="14" width="4" height="4" fill="#e8c4b8" opacity="0.8"/>
</svg>
